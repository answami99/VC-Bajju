</style></head><body><div class="shell"><aside class="sidebar"><div class="brand"><span class="brandmark">b</span><div><strong>Bajju VC</strong><small>Coordination desk</small></div></div><nav id="nav"></nav><div class="sidefoot"><b>DOIT&amp;C, Bajju</b>Bikaner · Rajasthan<div style="margin-top:22px" id="sidestatus"><span class="statusdot"></span>Connecting</div></div></aside><div><header class="topbar"><div class="headeridentity"><span class="signalmark" aria-hidden="true"><svg viewBox="0 0 48 48"><path class="signaltrack" d="M8 27C8 10 27 5 37 16S39 39 24 39 5 27 15 17 37 13 37 27"/><path class="signaltravel" d="M8 27C8 10 27 5 37 16S39 39 24 39 5 27 15 17 37 13 37 27" pathLength="100"/><circle class="signalcore" cx="24" cy="24" r="3"/><circle class="signalhalo" cx="24" cy="24" r="8"/></svg></span><div><span class="headername">Bajju <i>VC</i></span><span class="headercaption">DOIT&amp;C · BAJJU</span></div></div><div class="headermeta"><span id="clock"></span><span class="private"><span aria-hidden="true">↗</span> Private workspace</span></div><svg class="headerthread" viewBox="0 0 1000 12" preserveAspectRatio="none" aria-hidden="true"><path class="threadbase" d="M0 6H1000"/><path class="threadlight" d="M0 6H1000" pathLength="100"/></svg></header><main class="workspace" id="main"><div class="loading"><span class="spinner"></span><p>Opening your coordination desk…</p></div></main></div></div><div id="modal" hidden></div><div id="toast" class="toast" role="status" hidden></div>
<script>
const DEMO_MODE=false;
const GUEST_MODE=true;
let IS_OWNER=false;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),icons={desk:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',schedule:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18"/>',reviews:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="m9 12 2 2 4-4M9 6h6"/>',officers:'<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0112 0v3m1-16a3 3 0 010 6m3 10v-3a6 6 0 00-2-4"/>',monitor:'<path d="M2 12h5l3-8 4 16 3-8h5"/>',refresh:'<path d="M20 7v5h-5M4 17v-5h5M5 8a8 8 0 0114-2l1 3M4 15l1 3a8 8 0 0014-2"/>',check:'<path d="m5 12 4 4L19 6"/>',arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',access:'<rect x="6" y="10" width="12" height="11" rx="2"/><path d="M9 10V7a3 3 0 016 0v3"/>',plus:'<path d="M12 5v14M5 12h14"/>'};const icon=n=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+(icons[n]||icons.check)+'</svg>';
let state=null,view='desk',scheduleDay='focus',query='',busy=false,review=null,selection=new Set(),handoff=null,toastTimer;let routes=[['desk','Overview'],['schedule','Schedule'],['reviews','Reviews'],['officers','Officers'],['monitor','Monitor'],...(IS_OWNER?[['access','Access']]:[])];
if(window.top!==window.self){document.body.textContent='Open Bajju VC directly.';throw Error('Framed interface blocked');}
const BRIDGE_URL='https://script.google.com/macros/s/AKfycbyhIWz7ZhEVrGP5iUtrJvuDVIZwsHXQDtJ1BYxel-SweAll8bm6pvX7XA4rpZ0FSQc/exec';
const bridgeSession=crypto.randomUUID(),bridgePending=new Map();let bridgeWindow=null,bridgeOrigin=null,bridgeReadyResolve;
const bridgeReady=new Promise(resolve=>bridgeReadyResolve=resolve);
window.addEventListener('message',e=>{const m=e.data;if(!m||m.session!==bridgeSession)return;let host;try{host=new URL(e.origin).hostname}catch{return}if(!host.endsWith('-script.googleusercontent.com'))return;if(m.type==='bajju-ready'&&!bridgeWindow){bridgeWindow=e.source;bridgeOrigin=e.origin;bridgeReadyResolve();const note=document.getElementById('connectionnote');if(note)note.textContent='Your desk is ready.';const submit=document.querySelector('#accessform button[type="submit"]');if(submit)submit.disabled=false;}else if(m.type==='bajju-result'&&e.source===bridgeWindow&&e.origin===bridgeOrigin){const p=bridgePending.get(m.id);if(!p)return;bridgePending.delete(m.id);clearTimeout(p.timer);m.ok?p.resolve(m.result):p.reject(Error(m.result));}});
function direct(method,...args){return new Promise(async(resolve,reject)=>{let wait;try{await Promise.race([bridgeReady,new Promise((_,fail)=>wait=setTimeout(()=>fail(Error('The data connection could not load. Please reload the desk.')),20000))]);clearTimeout(wait);const id=crypto.randomUUID(),timer=setTimeout(()=>{bridgePending.delete(id);reject(Error('This request took too long. Refresh before retrying.'));},180000);bridgePending.set(id,{resolve,reject,timer});bridgeWindow.postMessage({type:'bajju-rpc',session:bridgeSession,id,method,args},bridgeOrigin);}catch(e){clearTimeout(wait);reject(e);}});}
const dataFrame=document.createElement('iframe');dataFrame.hidden=true;dataFrame.title='Bajju VC data connection';dataFrame.referrerPolicy='no-referrer';dataFrame.src=BRIDGE_URL+'?session='+encodeURIComponent(bridgeSession);document.body.append(dataFrame);setTimeout(()=>{if(!bridgeWindow){const note=document.getElementById('connectionnote');if(note)note.innerHTML='The connection could not load. <a href="" onclick="location.reload();return false">Reload the desk</a> to retry.';}},20000);

let browserCredential=null;
async function rpc(action,input={}){if(!GUEST_MODE)return direct('portalRequest',DEMO_MODE?'demo':action,DEMO_MODE?{action,input}:input);if(!browserCredential?.id)throw Error('ACCESS_REQUIRED');const challenge=await direct('portalAccess','challenge',{device:browserCredential.id,action,input});const signature=await crypto.subtle.sign('HMAC',browserCredential.key,new TextEncoder().encode(challenge.message));return direct('portalRequest',action,input,{device:browserCredential.id,id:challenge.id,signature:btoa(String.fromCharCode(...new Uint8Array(signature)))});}
function credentialStore(value){return new Promise((resolve,reject)=>{const request=indexedDB.open('BajjuVCAccess',1);request.onupgradeneeded=()=>request.result.createObjectStore('credentials');request.onerror=()=>reject(Error('Allow website storage to remember access.'));request.onsuccess=()=>{const db=request.result,tx=db.transaction('credentials',value?'readwrite':'readonly'),op=value?tx.objectStore('credentials').put(value,'browser'):tx.objectStore('credentials').get('browser');let result;op.onsuccess=()=>result=op.result;tx.oncomplete=()=>{db.close();resolve(value||result)};tx.onerror=()=>{db.close();reject(Error('Access could not be saved. Enable website storage and try again.'))};};});}
function browserLabel(){const ua=navigator.userAgent;const device=/iPhone/.test(ua)?'iPhone':/iPad/.test(ua)?'iPad':/Android/.test(ua)?'Android':/Mac/.test(ua)?'Mac':/Windows/.test(ua)?'Windows':'Device';const app=/Edg\//.test(ua)?'Edge':/Firefox|FxiOS/.test(ua)?'Firefox':/Chrome|CriOS/.test(ua)?'Chrome':/Safari/.test(ua)?'Safari':'Browser';return device+' · '+app;}
function updateRole(owner){IS_OWNER=owner;routes=[['desk','Overview'],['schedule','Schedule'],['reviews','Reviews'],['officers','Officers'],['monitor','Monitor'],...(owner?[['access','Access']]:[])];}
function accessGate(message=''){state=null;document.querySelector('.topbar .private').textContent='Invitation access';document.querySelector('.sidebar').hidden=true;document.querySelector('.shell').style.gridTemplateColumns='1fr';$('#main').innerHTML=head('Invitation required','Your desk awaits.','Contact Aditya Narayan Swami, Programmer, Bajju for the Access Key.')+`<section class="panel narrow"><div class="panelbody"><form id="accessform"><label class="field">Access Key<input name="code" autocomplete="off" maxlength="32" required placeholder="Enter your Access Key"></label><button class="btn primary" type="submit" ${bridgeWindow?'':'disabled'}>Open my desk ${icon('arrow')}</button><p id="connectionnote" class="note" aria-live="polite">${bridgeWindow?'Your desk is ready.':'Connecting to your desk…'}</p><p class="note">Your key works in more than one browser and stays valid until the host deletes it. This browser remembers access while its saved website data is available.</p><div id="accesserror" class="error" ${message?'':'hidden'}>${esc(message)}</div></form></div></section>`;}
async function boot(){try{if(GUEST_MODE){browserCredential=await credentialStore();if(!browserCredential?.id){accessGate();return;}}state=await rpc('state');updateRole(GUEST_MODE?state.owner===true:true);document.querySelector('.sidebar').hidden=false;document.querySelector('.shell').style.gridTemplateColumns='';render();}catch(e){if(GUEST_MODE)accessGate(e.message==='ACCESS_REQUIRED'?'This browser needs a valid Access Key.':e.message);else $('#main').innerHTML=empty('Your private workspace.',esc(e.message),'<button class="btn" onclick="location.reload()">Try again</button>');}}
async function accessCall(action,input={}){return GUEST_MODE?rpc('access_'+action,input):direct('portalAccess',action,input);}
let accessRegistry=null;
async function renderAccess(){try{const existing=document.getElementById('accesslists');const next=await accessCall('list',existing&&accessRegistry?.revision?{since:accessRegistry.revision}:{});if(view!=='access'||next.unchanged)return;accessRegistry=next;if(existing){existing.innerHTML=accessLists();const note=document.getElementById('accessupdate');if(note)note.textContent='Access list updated.';return;}$('#accesscontent').innerHTML=`<div class="panelbody">${!GUEST_MODE?`<div class="callout" style="margin-top:0"><h3>Your host access on GitHub</h3><p class="note">Create your private host key here once, then enter it on the GitHub desk. Keep it to yourself: it unlocks Access Management.</p><button class="btn" data-access="hostpair">Create my host key</button><div id="hostcode"></div></div>`:''}<form id="inviteform"><label class="field">Person to invite<input name="name" maxlength="60" required placeholder="Name of the person"></label><button class="btn primary" type="submit">Generate Access Key ${icon('plus')}</button><p class="note">Six digits · no expiry · reusable across browsers. Delete the key to remove all access given through it.</p></form><div id="invitecode"></div><div class="rule"></div><div id="accesslists">${accessLists()}</div><p id="accessupdate" class="note" aria-live="polite"></p></div>`;}catch(e){const note=document.getElementById('accessupdate');if(note){note.textContent='Could not update access right now. Will retry automatically.';}else $('#accesscontent').innerHTML=`<div class="panelbody error">${esc(e.message)}</div>`;}}
function accessLists(){return `<h2>Access keys · ${accessRegistry.codes.length}</h2><p class="note">View saved keys whenever you need them. Older keys whose originals were not retained still work, but cannot be displayed. If lost, create a new key; your remembered browsers keep working.</p>${accessRegistry.codes.map(c=>`<div class="row"><div class="rowcontent"><h3>${esc(c.name)}</h3><p class="meta">${c.role==='host'?'Host':'Member'} · ${c.browsers} browser${c.browsers===1?'':'s'} · No expiry${c.retrievable?'':' · Original key not retained'}</p></div><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end"><button class="btn" data-revealkey="${esc(c.id)}" ${c.retrievable?'':'disabled'}>View key</button><button class="btn danger" data-deletekey="${esc(c.id)}">Delete key</button></div></div>`).join('')||'<p class="note">No keys yet.</p>'}<div class="rule"></div><h2>Remembered browsers · ${accessRegistry.devices.length}</h2>${accessRegistry.devices.map(d=>`<div class="row"><div class="rowcontent"><h3>${esc(d.name)}</h3><p class="meta">Last used ${new Date(d.lastSeen).toLocaleString('en-IN')}</p></div><button class="btn danger" data-revoke="${esc(d.id)}">Remove browser</button></div>`).join('')||'<p class="note">No browsers have joined yet.</p>'}<p class="note">Removing a browser asks it to enter a key again. Deleting a key blocks that key and every browser registered with it.</p>`;}
function randomAccessCode(){let n;do{n=crypto.getRandomValues(new Uint32Array(1))[0]}while(n>=4294000000);return String(n%1000000).padStart(6,'0');}
document.addEventListener('submit',async e=>{if(!['accessform','inviteform'].includes(e.target.id))return;e.preventDefault();const f=e.target,b=f.querySelector('button[type="submit"]'),data=Object.fromEntries(new FormData(f));b.disabled=true;try{if(f.id==='accessform'){const raw=crypto.getRandomValues(new Uint8Array(32)),key=await crypto.subtle.importKey('raw',raw,{name:'HMAC',hash:'SHA-256'},false,['sign']);await credentialStore({key});const result=await direct('portalAccess','enroll',{code:data.code.trim(),browser:browserLabel(),secret:[...raw].map(x=>x.toString(16).padStart(2,'0')).join('')});raw.fill(0);browserCredential={key,id:result.id};await credentialStore(browserCredential);await boot();}else{const code=randomAccessCode();await accessCall('invite',{name:data.name,code});await renderAccess();$('#invitecode').innerHTML=`<div class="callout"><p class="eyebrow">Share privately with ${esc(data.name)}</p><p class="accessdigits">${code}</p><p class="note">No expiry. Can be used in multiple browsers. You can view this key again in Access Management until you delete it.</p></div>`;}}catch(err){if(f.id==='accessform'){const el=$('#accesserror');el.hidden=false;el.textContent=err.message;}else toast(err.message);}finally{b.disabled=false;}});
document.addEventListener('click',async e=>{const el=e.target.closest('[data-revoke],[data-deletekey],[data-revealkey],[data-access]');if(!el||!IS_OWNER)return;try{if(el.dataset.revealkey){const saved=await accessCall('reveal',{id:el.dataset.revealkey});modal('Access Key',`<p class="eyebrow">${esc(saved.name)}</p><p style="overflow-wrap:anywhere;font:24px monospace;user-select:all">${esc(saved.code)}</p><p class="note">Reusable in multiple browsers. No expiry. Valid until you delete this key. Share member keys privately; keep host keys to yourself.</p>`);}else if(el.dataset.deletekey){if(!confirm('Delete this key and remove access from every browser using it?'))return;await accessCall('delete',{id:el.dataset.deletekey});await boot();if(state)renderAccess();}else if(el.dataset.revoke){if(!confirm('Remove this browser? Its existing key can register it again. Delete the key to block access completely.'))return;await accessCall('revoke',{id:el.dataset.revoke});await boot();if(state)renderAccess();}else if(el.dataset.access==='hostpair'&&!GUEST_MODE){el.disabled=true;const code=[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,'0')).join('');await direct('portalAccess','hostpair',{name:'Aditya · Host',code});$('#hostcode').innerHTML=`<p class="note">Enter this once on your GitHub desk. Save it privately for your other browsers.</p><p style="overflow-wrap:anywhere;font-family:monospace;user-select:all">${code}</p>`;}}catch(err){toast(err.message);}});

let refreshing=false;function comparable(v){if(Array.isArray(v))return v.map(comparable);if(v&&typeof v==='object')return Object.fromEntries(Object.keys(v).sort().map(k=>[k,comparable(v[k])]));return v;}async function refreshWorkspace(){if(document.hidden||busy||refreshing||!$('#modal').hidden||!state)return;refreshing=true;try{if(view==='access'&&IS_OWNER){await renderAccess();return;}const next=await rpc('state');if(JSON.stringify(comparable(next))!==JSON.stringify(comparable(state))){state=next;render();}}catch(_){}finally{refreshing=false;}}function localPhone(n){return /^91[6-9]\d{9}$/.test(n||'')?n.slice(2):n||'';}
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,4500)}
function date(s){if(!s)return '—';const [d,m,y]=s.split('-');return new Date(`${y}-${m}-${d}T12:00:00+05:30`).toLocaleDateString('en-IN',{day:'numeric',month:'short',weekday:'short',timeZone:'Asia/Kolkata'});}function time(s){const m=String(s).match(/^(\d{1,2}):(\d{2})/);return m?`${(+m[1]%12)||12}:${m[2]} ${+m[1]>=12?'PM':'AM'}`:s||'—'}function checktime(s){return s?s.slice(11,16):'—'}function targetMeetings(){return state.meetings.filter(m=>m.date===state.focus)}
function setView(v){view=v;query='';render()}function nav(){ $('#nav').innerHTML=routes.map(([id,label])=>`<button data-view="${id}" class="${view===id?'active':''}" ${view===id?'aria-current="page"':''}>${icon(id)}<span>${label}</span>${id==='reviews'&&state.reviews.length?`<span class="badge">${state.reviews.length}</span>`:''}</button>`).join('');$('#sidestatus').innerHTML=`<span class="statusdot" style="${state.settings.Monitoring!=='On'?'background:#aaa':''}"></span>${state.settings.Monitoring==='On'?'Monitor active':'Monitor paused'}`;}
function head(eyebrow,title,sub,action=''){if(state?.profile?.name)eyebrow=esc(state.profile.name)+' · '+eyebrow;return `<div class="heading"><div><p class="eyebrow">${eyebrow}</p><h1>${title}</h1><p class="sub">${sub}</p></div>${action}</div>`}function createVCBtn(){return `<button class="btn lime" data-action="createvc">${icon('plus')} Create VC</button>`;}function checkBtn(){return `<button class="btn primary" data-action="check" ${busy?'disabled':''}>${busy?'<span class="spinner"></span>':icon('refresh')}${busy?'Checking…':'Check now'}</button>`}function empty(title,text,button='',symbol='check'){return `<div class="empty"><div class="symbol">${icon(symbol)}</div><h3>${title}</h3><p>${text}</p>${button}</div>`}function monitorMini(){const s=state.settings;return `<section class="panel"><div class="panelhead"><h2>Quietly keeping watch</h2><span class="statusdot"></span></div><div class="panelbody"><div class="detail"><span>Last attempt</span><strong>${esc(checktime(s['Last check completed']))} IST</strong></div><div class="detail"><span>Last successful check</span><strong>${esc(checktime(s['Last successful check']))} IST</strong></div><div class="detail"><span>Watching</span><strong>${state.focus===state.tomorrow?'Tomorrow':'Today'}</strong></div><div class="rule"></div><p class="note">06:00–11:00 · Today<br>18:00–23:00 · Tomorrow<br>Unchanged checks stay quiet.</p><button class="btn quiet" data-view="monitor">Monitor details ${icon('arrow')}</button></div></section>`}function meetingRow(m,reviewMode=false){const pending=state.reviews.find(r=>r.meeting===m.id&&r.revision===m.revision),manual=String(m.id).startsWith('MANUAL-');return `<div class="row"><div class="time">${esc(time(m.start))}<small>${esc(date(m.date))}</small></div><div class="rowcontent"><span class="pill ${pending?'warn':''}">${pending?(pending.event==='CANCELLED'?'Cancelled · notify officers':pending.event==='CHANGED'?'Schedule changed':'Needs your review'):esc(m.scope?.startsWith('Excluded')?'Outside block scope':m.status||'Scheduled')}</span><h3>${esc(m.title)}</h3>${manual?'<span class="pill">Manual VC · order / Webex</span>':''}<p class="meta">${esc(m.chair||'Chairperson not specified')}</p><p class="meta">${esc(m.rooms||'Rooms not specified')}</p></div>${!reviewMode&&!/cancel|रद्द/i.test(m.status||'')?`<button class="btn danger" data-cancelvc="${esc(m.id)}">Cancel VC</button>`:''}${manual&&!/cancel|रद्द/i.test(m.status||'')?`<button class="btn" data-editvc="${esc(m.id)}">Edit VC</button>`:''}${pending?`<button class="btn" data-review="${esc(pending.id)}">Review ${icon('arrow')}</button>`:''}</div>`}function reviewRows(){return state.reviews.map(r=>meetingRow({...r,id:r.meeting},true)).join('')}
function render(){if(!state)return;const person=state.profile?.name||'';document.querySelector('.topbar .private').textContent=person||'Private workspace';document.querySelector('.brand small').textContent=person||'Coordination desk';nav();if(DEMO_MODE)$('#main').setAttribute('data-demo','true');const s=state.settings;let html='';if(view==='access'&&IS_OWNER){html=head('Only you hold the keys','Access, thoughtfully given.','Give a person a reusable key. Delete it whenever you need to.')+'<section class="panel" id="accesscontent"><div class="loading">Loading approved browsers…</div></section>';queueMicrotask(renderAccess);}if(view==='desk'){html=head('Your coordination desk',state.reviews.length?'A few things need you.':'Everything in its place.',`${date(state.focus)} · ${state.focus===state.tomorrow?'Tomorrow’s':'Today’s'} VC schedule for Bajju.`,`<div style="display:flex;gap:8px;flex-wrap:wrap">${checkBtn()}${createVCBtn()}</div>`);html+=`<div class="stats"><div class="stat"><small>VCs on the schedule</small><strong>${targetMeetings().length.toString().padStart(2,'0')}</strong><p>${state.focus===state.tomorrow?'Tomorrow':'Today'} · portal records</p></div><div class="stat"><small>Reviews awaiting you</small><strong>${state.reviews.length.toString().padStart(2,'0')}</strong><p>New, changed or ready to send</p></div><div class="stat"><small>Officers connected</small><strong>${state.contacts.filter(c=>c.active).length.toString().padStart(2,'0')}</strong><p>Across ${new Set(state.contacts.filter(c=>c.active).map(c=>c.dept)).size} departments</p></div></div><div class="grid"><section class="panel"><div class="panelhead"><h2>Your next action</h2><span class="pill">${state.reviews.length?'Human approval':'All clear'}</span></div>${state.reviews.length?reviewRows():empty('No pending reviews.',!s['Last successful check']?'Run your first check to bring in the latest schedule.':`Nothing new needs approval in the last recorded schedule. Last successful check: ${esc(s['Last successful check'])} IST.`,`<button class="btn" data-view="schedule">View schedule ${icon('arrow')}</button>`)}</section><aside class="aside">${monitorMini()}${!state.contacts.length?`<div class="callout"><p class="eyebrow">Start here</p><h3>The right people, one place.</h3><p class="note">Add your block officers once. Choose several recipients together whenever a VC needs a notice.</p><button class="btn lime" data-action="add">${icon('plus')} Add your first officer</button></div>`:''}</aside></div>`;if(s['Last error'])html+=`<div class="error">The latest portal attempt failed. Saved data remains available. Open Monitor for the error and retry time.</div>`;}
if(view==='schedule'){const day=scheduleDay==='today'?state.today:scheduleDay==='tomorrow'?state.tomorrow:state.focus,ms=state.meetings.filter(m=>scheduleDay==='upcoming'?m.manual&&m.date!==state.today&&m.date!==state.tomorrow&&Date.parse(m.date.split('-').reverse().join('-')+'T'+m.start+':00+05:30')>Date.now():m.date===day).sort((a,b)=>a.date.split('-').reverse().join('-').localeCompare(b.date.split('-').reverse().join('-'))||a.start.localeCompare(b.start));html=head('The daily agenda','A clearer schedule.','Portal schedules and VCs received through orders, together.',`<div style="display:flex;gap:8px;flex-wrap:wrap">${checkBtn()}<button class="btn lime" data-action="createvc">${icon('plus')} Create VC</button></div>`)+`<div class="tabs"><button data-day="today" class="${scheduleDay!=='upcoming'&&day===state.today?'active':''}">Today · ${date(state.today).split(',')[0]}</button><button data-day="tomorrow" class="${scheduleDay!=='upcoming'&&day===state.tomorrow?'active':''}">Tomorrow</button><button data-day="upcoming" class="${scheduleDay==='upcoming'?'active':''}">Upcoming orders</button></div><section class="panel"><div class="panelhead"><h2>${scheduleDay==='upcoming'?'Upcoming manual VCs':esc(date(day))}</h2><span class="pill">${ms.length} VC${ms.length===1?'':'s'}</span></div>${ms.length?ms.map(m=>meetingRow(m)).join(''):empty('A little breathing room.',day===state.focus&&s['Last successful check']?'No VCs are recorded for this day. Check now to verify the latest portal schedule.':'No saved schedule for this day. Check now fetches the selected day, at any time.',checkBtn(),'schedule')}</section>`;}

ram alert']||'No alert recorded')} IST</strong></div>${s['Last Telegram error']?`<div class="error">${esc(s['Last Telegram error'])}</div>`:''}</div></section><aside><div class="callout" style="margin:0"><p class="eyebrow">A deliberate final step</p><h3>You stay in charge.</h3><p class="note">Every outgoing notice is verified against a fresh schedule. The portal opens your iPhone Shortcut directly for SMS, or prefilled recipient chats for WhatsApp.</p><p class="note">“Marked sent” is your confirmation, not a delivery receipt.</p><button class="btn" data-action="guide">iPhone setup ${icon('arrow')}</button></div></aside></div><section class="panel" style="margin-top:24px"><div class="panelhead"><h2>Activity journal</h2><span class="note">Latest 80 actions</span></div>${state.logs.length?state.logs.map(l=>`<div class="activity"><small>${esc(l.at)} IST</small><b>${esc(l.action)}</b><p>${esc(l.detail)}</p></div>`).join(''):empty('Nothing recorded yet.','The journal records changes, decisions and failures. Successful quiet checks update the status above.')}</section>`;}

function modal(title,body){$('#modal').hidden=false;$('#modal').innerHTML=`<div class="overlay"><section class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header class="drawerhead"><span>${esc(title)}</span><button class="close" data-action="close" aria-label="Close">×</button></header><div class="drawerbody">${body}<div id="modalerror" hidden class="error" role="alert"></div></div></section></div>`;$('#modal .close').focus();}function close(){if(busy)return;$('#modal').hidden=true;review=null;handoff=null}function error(e){const el=$('#modalerror');if(el&&!$('#modal').hidden){el.hidden=false;el.textContent=e.message;}else toast(e.message)}

function manualVCForm(id){const m=state.meetings.find(m=>m.id===id)||{},iso=(m.date||state.focus).split('-').reverse().join('-');modal(m.id?'Edit manual VC':'Create VC',`<p class="eyebrow">Received through an order</p><h1 style="font-size:30px">A place for every VC.</h1><p class="note">Save the details, then choose officers and approve SMS or WhatsApp in Reviews. Portal checks will keep this VC.</p><form id="manualvcform"><input type="hidden" name="id" value="${esc(m.id||'')}"><input type="hidden" name="revision" value="${esc(m.revision||'')}"><label class="field">Topic<input name="title" required maxlength="300" value="${esc(m.title||'')}"></label><label class="field">Date<input type="date" name="date" required value="${iso}"></label><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label class="field">Start time · IST<input type="time" name="start" required value="${esc(m.start||'')}"></label><label class="field">End time · IST<input type="time" name="end" required value="${esc(m.end||'')}"></label></div><label class="field">Chairperson<input name="chair" required maxlength="150" value="${esc(m.chair||'')}"></label><label class="field">Platform<select name="platform"><option ${m.platform==='Webex'?'selected':''}>Webex</option><option ${m.platform==='Other / order'?'selected':''}>Other / order</option></select></label><label class="field">Department · optional<input name="department" maxlength="150" value="${esc(m.department||'')}"></label><label class="field">Order reference · optional<input name="reference" maxlength="300" value="${esc(m.reference||'')}"></label><label class="field">Meeting link · optional<input type="url" name="link" value="${esc(m.link||'')}" placeholder="https://…"></label><p class="note">Officer notices keep the usual date, time, chairperson and topic. No message is sent when you save.</p><button class="btn primary" type="submit">Save VC & review ${icon('arrow')}</button></form>`);}document.addEventListener('submit',e=>{if(e.t async function perform(action,input={},success){if(busy)return;busy=true;document.querySelectorAll('button[data-action="check"]').forEach(b=>{b.disabled=true;b.innerHTML='<span class="spinner"></span> Checking…'});document.querySelectorAll('#modal button:not(.close)').forEach(b=>b.disabled=true);try{const result=await rpc(action,input);busy=false;if(success)success(result);else{state=result;render();toast(action==='check'?'Schedule checked. Your workspace is up to date.':'Workspace updated.');}}catch(e){busy=false;if($('#modal').hidden)render();else if(review&&!handoff)renderReview();error(e);}finally{busy=false;document.querySelectorAll('#modal button').forEach(b=>b.disabled=false);if(review&&!handoff)document.querySelectorAll('[data-method]').forEach(b=>b.disabled=!selection.size);}}
document.addEventListener('click',e=>{const el=e.target.closest('button,a');if(!el)return;if(el.dataset.view){setView(el.dataset.view);return}if(el.dataset.day){scheduleDay=el.dataset.day;render();return}if(el.dataset.review){openReview(el.dataset.review);return}if(el.dataset.cancelvc){const m=state.meetings.find(m=>m.id===el.dataset.cancelvc);if(m)modal('Cancel VC',`<h1 style="font-size:30px">Cancel this VC?</h1><p>${esc(m.title)}</p><p class="note">${esc(date(m.date))} · ${esc(time(m.start))}</p><p class="note">The cancellation stays saved even if RajVC still lists it as scheduled. Previously notified officers will be selected for a cancellation notice. You approve SMS or WhatsApp before sending.</p><button class="btn danger" data-confirmcancel="${esc(m.id)}">Confirm cancellation</button>`);return}if(el.dataset.confirmcancel){const m=state.meetings.find(m=>m.id===el.dataset.confirmcancel);if(m)perform('cancel_vc',{id:m.id,revision:m.revision},s=>{close();state=s;view='reviews';render();toast('VC cancelled. Review the cancellation notice and recipients.');});return}if(el.dataset.editvc){manualVCForm(el.dataset.editvc);return}if(el.dataset.contact){contactForm(el.dataset.contact);return}if(el.dataset.deletecontact||el.dataset.restorecontact){const restore=!!el.dataset.restorecontact,id=el.dataset.restorecontact||el.dataset.deletecontact,c=(restore?state.deletedContacts:state.contacts).find(c=>c.id===id);if(!c)return;if(!restore&&!confirm('Delete '+c.name+' from the directory? They will no longer be available as a recipient. You can restore them under Deleted officers.'))return;perform(restore?'contact_restore':'contact_delete',{id:c.id,version:c.version},s=>{state=s;render();toast(restore?'Officer restored as inactive. Edit to activate.':'Officer deleted. You can restore them below.');});return}if(el.dataset.method){if(busy||!review)return;const versions=Object.fromEntries([...selection].map(id=>[id,state.contacts.find(c=>c.id===id)?.version]));perform('approve',{id Keep Cancel enabled.</li><li>Add <b>Repeat with Each</b>, input <b>Phones</b>.</li><li>Inside the repeat, add <b>Send Message</b>: message <b>Body</b>, recipient <b>Repeat Item</b>. Turn <b>Show When Run</b> off. Keep Send Message above End Repeat.</li></ol><p class="note">Select the blue variable tokens, rather than typing variable names as text. Messages may send SMS, RCS or iMessage depending on the recipient and your device.</p>`);if(el.id==='smslaunch'||el.dataset.send!==undefined){if(!handoff||Date.now()>=handoff.payload.expiresAt){e.preventDefault();toast('Send links expired. Close and approve this VC again.');}else if(el.dataset.send!==undefined)el.textContent='Opened · '+handoff.payload.recipients[+el.dataset.send].label;}});
